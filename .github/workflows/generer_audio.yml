name: Générer un Audio-Livre

on:
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis l'onglet Actions
  schedule:
    - cron: '0 4 * * *' # Optionnel : exécution automatique quotidienne si besoin

jobs:
  build-audiobook:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer FFmpeg (assemblage audio)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          # Utilise la dernière version stable de FFmpeg pré-compilée
          ffmpeg-version: 'release'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Extraire, narrer et envoyer sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
