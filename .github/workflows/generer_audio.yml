name: Générer un Audio-Livre

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Lien de l article ou de la biographie (wol.jw.org)'
        required: true
        type: string
      voix:
        description: 'Voix du narrateur Gemini'
        required: true
        default: 'Fenrir'
        type: choice
        options:
          - Fenrir
          - Aoede
          - Charon
          - Kore

jobs:
  build-audiobook:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer FFmpeg (rapide sans apt-get)
        run: |
          sudo curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          sudo tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Installer les dépendances Python
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 pydub python-dotenv

      - name: Extraire, narrer et envoyer sur Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python narrateur.py "${{ inputs.url }}" "${{ inputs.voix }}"
